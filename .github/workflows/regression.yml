name: Regression checks

on:
  push:
    branches: [master, Rubai-dev]
  pull_request:
    branches: [master, Rubai-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit, build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEYONDERS_MODE: public
      NEXT_PUBLIC_BEYONDERS_MODE: public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint application and test code
        run: npm run lint

      - name: Run unit and data-contract regression tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Set up Python for browser regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run production-browser regression suite
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/beyonders-next.log"
          npm run start -- --hostname 127.0.0.1 --port 3140 >"$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3140/wetland >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            cat "$LOG_FILE"
            echo "::error::Production server did not become ready."
            exit 1
          fi

          python tests/e2e/multi_case_module_smoke.py http://127.0.0.1:3140
