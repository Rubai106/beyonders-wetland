name: Agriculture and project QA

on:
  push:
    branches: [Rubai-dev]
    paths:
      - '.github/workflows/agriculture-qa.yml'
      - 'pipeline/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docs/agriculture-*.md'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: agriculture-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Compile Agriculture Python modules
        run: python -m py_compile pipeline/agriculture_sme2.py pipeline/test_agriculture_sme2.py

      - name: Run full offline Python regression suite
        run: python -m unittest discover -s pipeline -p 'test_*.py' -v

      - name: Run Agriculture TypeScript schema tests
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning --loader ./tests/strip-loader.mjs --test src/lib/agriculture-study.test.ts

      - name: Run ESLint
        run: npm run lint

      - name: Build read-only public viewer
        run: npm run build
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public

      - name: Run whole-project TypeScript check
        run: npx tsc --noEmit
