name: Agriculture and project QA

on:
  push:
    branches: [master, Rubai-dev]
    paths:
      - '.github/workflows/agriculture-qa.yml'
      - '.github/workflows/agriculture-cloud.yml'
      - 'pipeline/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docs/agriculture-*.md'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: agriculture-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Compile Python modules and browser smoke tests
        run: python -m py_compile pipeline/agriculture_sme2.py pipeline/agriculture_imerg.py pipeline/agriculture_pilot_screen.py pipeline/test_agriculture_sme2.py pipeline/test_agriculture_imerg.py pipeline/test_agriculture_pilot_screen.py tests/e2e/explore_smoke.py tests/e2e/wetland_smoke.py tests/e2e/chokwe_deep_link_smoke.py tests/e2e/multi_case_module_smoke.py tests/e2e/agriculture_evidence_chain_smoke.py tests/e2e/scattering_hypothesis_smoke.py

      - name: Run full offline Python regression suite
        run: python -m unittest discover -s pipeline -p 'test_*.py' -v

      - name: Run all TypeScript unit regression tests
        run: npm run test:unit

      - name: Run ESLint
        run: npm run lint

      - name: Build read-only public viewer
        run: npm run build
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public

      - name: Run whole-project TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright browser-test dependency
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Install Chromium for production browser test
        run: python -m playwright install --with-deps chromium

      - name: Run multi-case Wetland, Forest, Volcano, Chókwè, scattering and Agriculture browser smoke tests
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3140 > /tmp/beyonders-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3140/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/beyonders-next.log
              echo "Next.js production server did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          python tests/e2e/multi_case_module_smoke.py http://127.0.0.1:3140
          python tests/e2e/chokwe_deep_link_smoke.py http://127.0.0.1:3140
          python tests/e2e/scattering_hypothesis_smoke.py http://127.0.0.1:3140
          python tests/e2e/agriculture_evidence_chain_smoke.py http://127.0.0.1:3140
